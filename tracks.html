<meta property="og:description" content="Collez un texte : Oulipao le range en pistes (noms, verbes, adjectifs…) et y branche des contraintes oulipiennes que l’on règle en direct, comme sur une table de mixage. Tout tourne dans le navigateur.">

<style>
  /* « L'instrument perforé » : DESIGN.md. Façade grise, bande de papier, pas percés. */
  main { max-width: 1240px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-12); }
  h2, h3 { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* Une touche de façade : contour d'encre, sérigraphie ; enfoncée, elle s'inverse */
  button { font-family: var(--font-ui); font-stretch: var(--silk-stretch); font-weight: 600; font-size: var(--size-label); text-transform: uppercase; letter-spacing: 0.02em;
    background: var(--panel); border: var(--rule) solid var(--ink); border-radius: var(--radius); padding: 4px 9px; min-height: 28px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  /* Un lien de façade : une touche qui mène ailleurs (« Code source ») */
  a.key, label.key { font-family: var(--font-ui); font-stretch: var(--silk-stretch); font-weight: 600; font-size: var(--size-label); text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--ink); background: var(--panel); border: var(--rule) solid var(--ink); border-radius: var(--radius); padding: 4px 9px; min-height: 28px;
    display: inline-flex; align-items: center; text-decoration: none; box-sizing: border-box; }
  a.key:hover, label.key:hover { background: var(--ink); color: var(--panel); }
  label.key { cursor: pointer; }
  label.key:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* La version garde son « v » minuscule : « v0.2.0 », pas « V0.2.0 ». */
  a.version-link { text-transform: none; }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { background: var(--paper); border: var(--rule) solid var(--ink); border-radius: var(--radius); }
  input[type="number"], input[type="text"].param-text, select { font-family: var(--font-mono); font-size: var(--size-small); min-height: 28px; padding: 2px 4px; }
  input[type="number"] { width: 4.5rem; text-align: center; }
  input[type="text"].param-text { width: 9rem; text-align: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .noun { --track: var(--noun); } .verb { --track: var(--verb); } .adjective { --track: var(--adjective); }
  .adverb { --track: var(--adverb); } .other { --track: var(--other); }
  .shape { width: 16px; height: 16px; flex: none; color: var(--track); }

  /* En-tête : la marque en pochoir, seule */
  .bar { display: flex; align-items: baseline; gap: var(--space-4); border-bottom: var(--rule) solid var(--line); padding-bottom: var(--space-3); margin-bottom: var(--space-6); }
  .bar h1 { font: 800 var(--size-mark)/1 var(--font-mark); letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }
  .bar .silk { flex: 1; }
  .pin-sentinel { height: 1px; }

  /* Bande de sortie : papier perforé sur ses bords ; collée en haut de l'écran quand on descend */
  .result { position: sticky; top: 0; z-index: 2; background: var(--paper); border: var(--rule) solid var(--line); padding: var(--space-4) var(--space-8); margin-bottom: var(--space-4); }
  .result::before, .result::after { content: ""; position: absolute; top: 0; bottom: 0; width: 10px;
    background-image: radial-gradient(circle at 5px 8px, var(--panel) 3px, transparent 3.5px); background-size: 10px 16px; }
  .result::before { left: 6px; } .result::after { right: 6px; }
  .result-header { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-3); }
  .result-header h2 { flex: 1; }
  .copy-message { font-size: var(--size-small); color: var(--muted); }
  /* Plafonnée : un texte long défile dans la bande, sans avaler la molette quand il ne déborde pas */
  .result-scroll { overflow-y: auto; max-height: 60svh; }
  .result-text { white-space: pre-wrap; font: var(--size-read)/1.6 var(--font-read); max-width: var(--measure); margin: 0; }
  .result-empty { font: italic var(--size-read)/1.6 var(--font-read); color: var(--muted); margin: 0; }
  .result.stuck { border-color: var(--ink); padding-top: var(--space-2); padding-bottom: var(--space-2); }
  .result.stuck .result-header { margin-bottom: var(--space-1); }
  .result.stuck .result-text { font-size: var(--size-read-compact); line-height: 1.5; }
  .result.stuck .result-scroll { max-height: calc(4 * var(--size-read-compact) * 1.5); }
  .word { cursor: pointer; border-radius: var(--radius); }
  .word:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .replaced { text-decoration: underline; text-decoration-color: var(--track); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .word.selected { outline: 2px solid var(--ink); outline-offset: 1px; }
  .changed { animation: flash var(--signature) ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--track, var(--ink)) 22%, transparent); } }
  .notice { font-size: var(--size-small); color: var(--muted); margin: var(--space-2) 0 0; }
  .stale .result-text { opacity: .45; }
  /* Un refrain recopie un vers : italique et encre secondaire, annoncé aux lecteurs d'écran. */
  .result-text .copy { font-style: italic; color: var(--muted); }
  .form-choice { display: inline-flex; gap: var(--space-2); align-items: center; }
  .syllables { font: 400 var(--size-label) var(--font-mono); color: var(--muted); margin-left: var(--space-2); vertical-align: middle; user-select: none; }

  /* Saisie : dépliée, ou repliée en une ligne */
  .source { border: var(--rule) solid var(--line); padding: var(--space-3); margin-bottom: var(--space-4); }
  .source.folded { display: flex; gap: var(--space-3); align-items: center; color: var(--muted); }
  .source label { display: block; margin-bottom: var(--space-1); }
  textarea { width: 100%; height: 8rem; box-sizing: border-box; padding: var(--space-3); font: 17px/1.55 var(--font-read); }
  .controls { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-2); }
  .input-message, .privacy, .more, .summary, .inspector-hint, .section-hint { color: var(--muted); font-size: var(--size-small); }
  .loading { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; color: var(--muted); margin: var(--space-3) 0 0; }
  .loading progress { width: 12rem; accent-color: var(--ink); }
  .error { color: var(--error); }
  .privacy { margin: var(--space-2) 0 0; }
  .stale-bar { margin: 0 0 var(--space-3); }
  .summary { margin: 0 0 var(--space-3); }

  /* Chaîne : une ligne par filtre, toutes de même largeur, colonnes alignées */
  .chain { border: var(--rule) solid var(--line); padding: var(--space-3); margin-bottom: var(--space-4); display: grid; gap: var(--space-2); }
  .slots { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
  .slot { position: relative; display: grid; grid-template-columns: 10px 2ch 11ch 25rem minmax(0, 1fr) auto auto; column-gap: var(--space-3); row-gap: var(--space-1);
    align-items: center; border: var(--rule) solid var(--ink); border-radius: var(--radius); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); }
  .slot.off { border-style: dashed; border-color: var(--muted); }
  .slot.off .name, .slot.off .param, .slot.off .help { color: var(--muted); }
  .grip { width: 10px; height: 18px; cursor: grab; background-image: radial-gradient(circle, var(--muted) 1.2px, transparent 1.5px); background-size: 5px 5px; }
  .pos { font-size: 11px; color: var(--muted); }
  .name { font-stretch: var(--silk-stretch); font-weight: 700; text-transform: uppercase; font-size: var(--size-label); }
  .param, .targets, .slot-keys { display: inline-flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .param label { display: inline-flex; gap: var(--space-1); align-items: center; }
  .chip { display: inline-flex; gap: 4px; align-items: center; color: var(--track); border-color: currentColor; font-size: 11px; }
  .chip .shape { width: 11px; height: 11px; }
  .chip[aria-pressed="true"] { background: transparent; color: var(--track); }
  .chip[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
  .chip:disabled { opacity: 1; cursor: default; } /* la seule piste visée : enfoncée, sans s'éteindre */
  .slot-keys button { min-width: 28px; }
  .help { grid-column: 3 / -1; margin: 0; font-size: var(--size-small); color: var(--muted); }
  .slot.dragging { opacity: .4; }
  .slot.drop-before::before, .slot.drop-after::after { content: ""; position: absolute; left: -2px; right: -2px; height: 3px; background: var(--ink); }
  .slot.drop-before::before { top: -6px; } .slot.drop-after::after { bottom: -6px; }
  /* Navigateur de contraintes : une touche qui déplie les recettes, puis les moteurs */
  .browser > summary { display: inline-flex; align-items: center; gap: var(--space-1); list-style: none; cursor: pointer;
    font-family: var(--font-ui); font-stretch: var(--silk-stretch); font-weight: 600; font-size: var(--size-label); text-transform: uppercase; letter-spacing: 0.02em;
    background: var(--panel); border: var(--rule) solid var(--ink); border-radius: var(--radius); padding: 4px 9px; min-height: 28px; box-sizing: border-box; }
  .browser > summary::-webkit-details-marker { display: none; }
  .browser > summary::before { content: "▸"; }
  .browser[open] > summary { background: var(--ink); color: var(--panel); }
  .browser[open] > summary::before { content: "▾"; }
  .browser > section { border-top: var(--rule) solid var(--line); margin-top: var(--space-3); padding-top: var(--space-2); }
  .browser h3 { margin: 0 0 var(--space-1); }
  .section-hint { margin: 0 0 var(--space-2); }
  .recipes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
  .recipe { display: grid; grid-template-columns: 24ch minmax(0, 1fr) auto; column-gap: var(--space-3); row-gap: var(--space-1); align-items: center; }
  .recipe .add-recipe { justify-self: start; }
  .recipe .rule { font-size: var(--size-small); color: var(--muted); }
  .recipe .sheet { font-size: var(--size-small); color: var(--ink); white-space: nowrap; }
  .recipe .choice:not([hidden]) { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-left: var(--space-4); border-left: var(--rule) solid var(--ink); }
  .recipe .choice label { display: inline-flex; gap: var(--space-2); align-items: center; }
  .engines { display: flex; flex-wrap: wrap; gap: var(--space-2); }

  /* Grille : une ligne par piste, une colonne par mot, un pas percé ou bouché */
  .rack { border: var(--rule) solid var(--line); margin-bottom: var(--space-4); }
  .rack-head { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-bottom: var(--rule) solid var(--line); }
  .pages { display: flex; gap: var(--space-1); align-items: center; }
  .pages .pos { font-size: var(--size-label); color: var(--ink); min-width: 9ch; text-align: center; }
  .grid { --strip: 236px; display: grid; grid-template-columns: var(--strip) repeat(var(--per), minmax(0, 1fr)); position: relative; container-type: inline-size; }
  .grid > * { border-bottom: var(--rule) solid var(--line); }
  .corner { padding: var(--space-2) var(--space-3); display: flex; align-items: end; }
  .hd { all: unset; box-sizing: border-box; padding: var(--space-2) 2px var(--space-1); text-align: center; border-left: var(--rule) solid var(--line); border-bottom: var(--rule) solid var(--line); cursor: pointer; min-width: 0; }
  div.hd { cursor: default; }
  .hd .num { display: block; font-size: 11px; color: var(--muted); }
  .hd.beat .num { color: var(--ink); font-weight: 700; }
  .hd .w { display: block; font-family: var(--font-read); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .hd[aria-pressed="true"] .w { font-weight: 600; }
  .hd:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .ch { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; column-gap: var(--space-2); padding: var(--space-1) var(--space-3); min-height: 48px; }
  .ch .name { color: var(--track); font-size: 13px; }
  .ch .count { font-size: 11px; color: var(--muted); margin-left: var(--space-1); font-weight: 400; }
  .ch-keys { display: flex; gap: var(--space-1); }
  .ch.off .name, .ch.off .shape { opacity: .4; }
  .reminder { grid-column: 2 / -1; margin: 0; font-size: 11px; color: var(--muted); }
  .cell { border-left: var(--rule) solid var(--line); display: grid; place-items: center; position: relative; min-height: 48px; min-width: 0; }
  button.cell { all: unset; box-sizing: border-box; display: grid; place-items: center; position: relative; min-height: 48px; border-left: var(--rule) solid var(--line); border-bottom: var(--rule) solid var(--line); cursor: pointer; }
  button.cell:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }
  .cell .shape { width: 24px; height: 24px; }
  .cell.closed .shape { opacity: .55; }
  .cell.sel { background: color-mix(in srgb, var(--paper) 60%, transparent); }
  .lock { position: absolute; top: 3px; right: 3px; font-size: 9px; line-height: 1; border: var(--rule) solid var(--ink); padding: 1px 2px; background: var(--panel); }
  /* Le moment signé : une tête de lecture balaie la grille quand le texte change */
  .head { position: absolute; top: 0; bottom: 0; left: var(--strip); width: 2px; background: var(--ink); opacity: 0; pointer-events: none; border: 0;
    animation: sweep var(--signature) ease-in-out; }
  @keyframes sweep { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(calc(100cqw - var(--strip))); } }

  /* Inspecteur : une ligne par étape, chaque mot dans sa colonne */
  .inspector { border: var(--rule) solid var(--line); padding: var(--space-3); overflow-x: auto; } /* une fenêtre trop large défile dans l'inspecteur, pas la page */
  .inspector:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .inspector table { border-collapse: collapse; font: 15px/1.4 var(--font-read); }
  .inspector caption { text-align: left; font: 600 var(--size-ui) var(--font-ui); padding-bottom: var(--space-2); }
  .step-state { font-weight: 400; color: var(--muted); }
  .pronunciation { margin: 0 0 var(--space-2); font: var(--size-small) var(--font-mono); }
  .pronunciation .silk { margin-right: var(--space-2); }
  .inspector th { text-align: left; font: var(--size-small) var(--font-ui); color: var(--muted); padding-right: var(--space-3); white-space: nowrap; }
  .lock-field { display: inline-flex; gap: var(--space-1); align-items: center; margin-left: var(--space-2); }
  .lock-field input { width: 3.5rem; }
  .lock-note { margin-left: var(--space-2); color: var(--ink); }
  .inspector td { padding: var(--space-1) var(--space-2); border-bottom: var(--rule) solid var(--line); text-align: center; white-space: nowrap; }
  .inspector td.chosen { background: var(--paper); font-weight: 600; }
  .inspector-help { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; color: var(--muted); font-size: var(--size-small); }

  /* Carnet : les textes gardés, sous l'inspecteur ; chaque texte sur papier, comme la bande de sortie */
  .notebook { border-top: var(--rule) solid var(--line); margin-top: var(--space-6); padding-top: var(--space-4); }
  .notebook-header { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); }
  .notebook-header h2 { flex: 1; }
  .notebook-count, .notebook-message, .kept-at, .kept-mention { font-size: var(--size-small); color: var(--muted); }
  .notebook-message { margin: 0 0 var(--space-2); }
  .notebook-message:empty { display: none; }
  .notebook-entries { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
  .notebook-entry { background: var(--paper); border: var(--rule) solid var(--line); padding: var(--space-3) var(--space-4); }
  .kept-at { font-family: var(--font-ui); }
  .kept-text { white-space: pre-wrap; font: var(--size-read)/1.6 var(--font-read); max-width: var(--measure); margin: var(--space-1) 0; overflow-wrap: anywhere; }
  .kept-mention { font-style: italic; margin: 0 0 var(--space-2); }
  .kept-actions { display: flex; gap: var(--space-2); }

  @media (prefers-reduced-motion: reduce) { .changed { animation: none; } .head { display: none; } }

  /* Sous 1024 px : chaque filtre passe sur plusieurs rangs ; sous 768 px, tout se resserre */
  @media (max-width: 1023px) {
    .slot { grid-template-columns: 10px 2ch 1fr auto; }
    .slot .param { grid-column: 3 / -1; }
    .slot .targets { grid-column: 1 / -1; }
    .slot .power { grid-column: 1 / 4; justify-self: start; }
    .slot .slot-keys { grid-column: 4; justify-self: end; }
    .help { grid-column: 1 / -1; }
  }
  @media (max-width: 639px) {
    .recipe { grid-template-columns: minmax(0, 1fr) auto; }
    .recipe .rule { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (max-width: 767px) {
    .bar .silk { display: none; }
    .bar h1 { font-size: 34px; }
    .result { padding: var(--space-3) var(--space-6); }
    .result-text, .kept-text { font-size: 19px; }
    .result.stuck .result-scroll { max-height: calc(3 * var(--size-read-compact) * 1.5); }
    .grid { --strip: 116px; }
    .ch { grid-template-columns: 14px 1fr; padding: var(--space-1) var(--space-2); }
    .ch-keys { grid-column: 1 / -1; }
    .ch .count, .reminder { display: none; }
    button, a.key { min-height: 32px; }
    .inspector .far { display: none; }
  }
</style>
</head>
<body>
<!-- Les poinçons des pistes : rond, carré, fente, triangle, croix (DESIGN.md, Shapes). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="shape-noun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/></symbol>
    <symbol id="shape-verb" viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="13" height="13"/></symbol>
    <symbol id="shape-adjective" viewBox="0 0 20 20"><rect x="2" y="7.5" width="16" height="5"/></symbol>
    <symbol id="shape-adverb" viewBox="0 0 20 20"><polygon points="10,2.5 18,17 2,17"/></symbol>
    <symbol id="shape-other" viewBox="0 0 20 20"><path d="M4 7.2 7.2 4 10 6.8 12.8 4 16 7.2 13.2 10 16 12.8 12.8 16 10 13.2 7.2 16 4 12.8 6.8 10z"/></symbol>
  </defs>
</svg>
<div id="app"></div>
<script type="module" src="dist/tracks.js"></script>
</body>
