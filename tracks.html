<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potao — pistes</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  main { max-width: 76rem; margin: var(--space-6) auto; padding: 0 var(--space-4); }
  h1 { font: 600 var(--size-title)/1.2 var(--font-read); margin: 0 0 var(--space-3); }
  h2, h3 { font-size: var(--size-ui); font-weight: 600; margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: var(--rule) solid var(--line); border-radius: var(--radius); padding: var(--space-1) var(--space-3); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { background: var(--bg); border: var(--rule) solid var(--line); border-radius: var(--radius); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Saisie : dépliée, ou repliée en une ligne */
  .source { margin-bottom: var(--space-6); }
  .source.folded { display: flex; gap: var(--space-3); align-items: center; color: var(--muted); }
  .definition { font: var(--size-read)/1.5 var(--font-read); max-width: var(--measure); margin: 0 0 var(--space-4); }
  .source label { display: block; font-weight: 600; margin-bottom: var(--space-1); }
  textarea { width: 100%; height: 8rem; box-sizing: border-box; padding: var(--space-2); }
  .controls { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-3); }
  .input-message, .copy-message, .privacy, .count, .help, .more, .notice, .summary { color: var(--muted); }
  .loading { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; color: var(--muted); margin: var(--space-3) 0 0; }
  .loading progress { width: 12rem; }
  .error { color: var(--error); }
  .privacy { font-size: var(--size-small); margin: var(--space-2) 0 0; }

  /* Table de mixage à gauche, texte résultant et inspecteur à droite */
  .workspace { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: var(--space-8); align-items: start; }
  .mixer { position: sticky; top: var(--space-3); }
  .strip { border-bottom: var(--rule) solid var(--line); padding: var(--space-2) 0; }
  .strip-row { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: var(--space-2); align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--track); }
  .count { font-size: var(--size-small); }
  .strip button { padding: 2px var(--space-2); font-size: var(--size-small); }
  .plugin { display: grid; gap: var(--space-2); margin: var(--space-2) 0 0 18px; font-size: var(--size-small); }
  .plugin label { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
  .plugin input { width: 4.5rem; }
  .plugin.off label { opacity: .6; }
  .power { justify-self: start; }
  .help { margin: 0; }
  .more { font-size: var(--size-small); margin: var(--space-3) 0 0; }
  .reminder { font-size: var(--size-small); color: var(--muted); margin: var(--space-1) 0 0 18px; }
  /* Rack : les filtres dans l'ordre de la chaîne */
  .rack { padding: var(--space-3) 0; border-bottom: var(--rule) solid var(--line); }
  .rack ol { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: grid; gap: var(--space-3); }
  .unit { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); gap: var(--space-1) var(--space-2); padding-top: var(--space-2); border-top: var(--rule) dashed var(--line); }
  .rank { font-weight: 600; color: var(--muted); padding-top: var(--space-1); }
  .unit .plugin, .targets, .unit-actions { grid-column: 2; margin: 0; }
  .targets, .unit-actions, .add { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .rack button { padding: 2px var(--space-2); font-size: var(--size-small); }
  .chip { border-color: var(--track); }
  .chip:disabled { opacity: 1; cursor: default; } /* la seule piste visée : enfoncée, sans s'éteindre */
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--track) 30%, transparent); color: var(--fg); border-color: var(--track); }
  .add { margin-top: var(--space-3); }
  .noun { --track: var(--noun); } .verb { --track: var(--verb); } .adjective { --track: var(--adjective); }
  .adverb { --track: var(--adverb); } .other { --track: var(--other); }

  .stale-bar { margin: 0 0 var(--space-3); }
  .summary { margin: 0 0 var(--space-3); }
  .result { border-bottom: var(--rule) solid var(--line); padding-bottom: var(--space-4); margin-bottom: var(--space-6); }
  .result-header { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .result-text { white-space: pre-wrap; font: var(--size-read)/1.6 var(--font-read); max-width: var(--measure); margin: var(--space-3) 0 0; }
  .result-empty { font: var(--size-read)/1.6 var(--font-read); color: var(--muted); }
  .word { cursor: pointer; border-radius: 2px; }
  .word:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .replaced { text-decoration: underline; text-decoration-color: var(--track); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .word.selected { outline: 2px solid var(--fg); outline-offset: 1px; }
  .changed { animation: flash 333ms ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--noun) 30%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .changed { animation: none; } }
  .notice { font-size: var(--size-small); margin: var(--space-2) 0 0; }
  .stale .result-text { opacity: .45; }

  /* Inspecteur : une ligne par étape, chaque mot dans sa colonne */
  .inspector-hint { color: var(--muted); font-size: var(--size-small); }
  .inspector { margin-top: var(--space-3); overflow-x: auto; } /* une fenêtre trop large défile dans l'inspecteur, pas la page */
  .inspector:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .inspector table { border-collapse: collapse; font: var(--size-ui)/1.4 var(--font-read); }
  .inspector caption { text-align: left; font: 600 var(--size-ui) var(--font-ui); padding-bottom: var(--space-2); }
  .inspector th { text-align: left; font: var(--size-small) var(--font-ui); color: var(--muted); padding-right: var(--space-3); white-space: nowrap; }
  .inspector td { padding: var(--space-1) var(--space-2); border-bottom: var(--rule) solid var(--line); text-align: center; white-space: nowrap; }
  .inspector td.chosen { background: color-mix(in srgb, var(--fg) 10%, transparent); font-weight: 600; }
  .inspector-help { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; color: var(--muted); font-size: var(--size-small); }
  .inspector-help button { padding: 2px var(--space-2); font-size: var(--size-small); }

  /* Sous 1024 px : tout en une colonne */
  @media (max-width: 1023px) {
    .workspace { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
    .mixer { position: static; }
  }
  @media (max-width: 767px) { .inspector .far { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="dist/tracks.js"></script>
</body>
</html>
