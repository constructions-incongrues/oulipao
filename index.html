<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potao — essai d'étiquetage et S+7</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  body { line-height: 1.6; max-width: 46rem; margin: var(--space-8) auto; padding: 0 var(--space-4); }
  textarea { width: 100%; height: 10rem; font: inherit; box-sizing: border-box; background: var(--bg); color: var(--fg); border: var(--rule) solid var(--line); border-radius: var(--radius); }
  .controls { display: flex; gap: var(--space-3); align-items: center; margin: var(--space-3) 0; flex-wrap: wrap; }
  #output, #s7-output { white-space: pre-wrap; border-top: var(--rule) solid var(--line); padding-top: var(--space-4); }
  #s7-output { font: var(--size-read)/1.6 var(--font-read); }
  #offset { width: 4.5rem; font: inherit; }
  h2 { font-size: 1.1rem; margin-top: var(--space-8); }
  #s7-status { color: var(--muted); }
  #s7-status.error { color: var(--error); }
  #output span, .legend span { border-radius: var(--radius); padding: 0 2px; }
  /* Couleur + soulignement : la catégorie reste lisible sans distinguer les teintes. */
  .noun { background: color-mix(in srgb, var(--noun) 22%, transparent); }
  .verb { background: color-mix(in srgb, var(--verb) 22%, transparent); text-decoration: underline; }
  .adjective { background: color-mix(in srgb, var(--adjective) 22%, transparent); text-decoration: underline dotted; }
  .adverb { background: color-mix(in srgb, var(--adverb) 22%, transparent); text-decoration: underline wavy; }
  .other { color: var(--muted); }
  #status { color: var(--muted); }
  #status.error { color: var(--error); }
</style>
</head>
<body>
<h1>Potao — essai d'étiquetage et S+7</h1>
<p>Le texte collé reste dans ce navigateur : il n'est envoyé nulle part.</p>
<label for="text">Texte à étiqueter</label>
<textarea id="text" placeholder="Collez un texte en français…"></textarea>
<div class="controls">
  <label for="tagger">Étiqueteur</label>
  <select id="tagger"></select>
  <button id="run">Étiqueter</button>
  <span id="status" role="status" aria-live="polite"></span>
</div>
<p class="legend" id="legend"></p>
<div id="output"></div>
<h2>S+7</h2>
<div class="controls">
  <label for="offset">Décalage</label>
  <input id="offset" type="number" value="7" step="1">
  <label for="mode">Mode</label>
  <select id="mode">
    <option value="reagree">réaccord (S+7 strict)</option>
    <option value="same-gender">même genre</option>
  </select>
  <span id="s7-status" role="status" aria-live="polite"></span>
</div>
<div id="s7-output"></div>
<script type="module" src="dist/page.js"></script>
</body>
</html>
