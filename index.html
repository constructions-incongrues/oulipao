<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potao — essai d'étiquetage et S+7</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 10rem; font: inherit; box-sizing: border-box; }
  .controls { display: flex; gap: .75rem; align-items: center; margin: .75rem 0; flex-wrap: wrap; }
  #output, #s7-output { white-space: pre-wrap; border-top: 1px solid #ccc; padding-top: 1rem; }
  #offset { width: 4.5rem; font: inherit; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  #s7-status { color: #666; }
  #s7-status.error { color: #c00; }
  #output span, .legend span { border-radius: 3px; padding: 0 2px; }
  /* Couleur + soulignement : la catégorie reste lisible sans distinguer les teintes. */
  .noun { background: #ffd8a8; }
  .verb { background: #a5d8ff; text-decoration: underline; }
  .adjective { background: #b2f2bb; text-decoration: underline dotted; }
  .adverb { background: #eebefa; text-decoration: underline wavy; }
  .other { color: #666; }
  #status { color: #666; }
  #status.error { color: #c00; }
</style>
</head>
<body>
<h1>Potao — essai d'étiquetage et S+7</h1>
<p>Le texte collé reste dans ce navigateur : il n'est envoyé nulle part.</p>
<label for="text">Texte à étiqueter</label>
<textarea id="text" placeholder="Collez un texte en français…"></textarea>
<div class="controls">
  <label for="tagger">Étiqueteur</label>
  <select id="tagger"></select>
  <button id="run">Étiqueter</button>
  <span id="status" role="status" aria-live="polite"></span>
</div>
<p class="legend" id="legend"></p>
<div id="output"></div>
<h2>S+7</h2>
<div class="controls">
  <label for="offset">Décalage</label>
  <input id="offset" type="number" value="7" step="1">
  <label for="mode">Mode</label>
  <select id="mode">
    <option value="reagree">réaccord (S+7 strict)</option>
    <option value="same-gender">même genre</option>
  </select>
  <span id="s7-status" role="status" aria-live="polite"></span>
</div>
<div id="s7-output"></div>
<script type="module" src="dist/page.js"></script>
</body>
</html>
